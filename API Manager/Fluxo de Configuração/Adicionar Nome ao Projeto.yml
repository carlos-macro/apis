info:
  name: Adicionar Nome ao Projeto
  type: http
  seq: 3

http:
  method: PUT
  url: "{{API_MANAGER_URL}}/projectsetting/{{PROJECT_ID_NOVA_CONFIGURACAO}}/name"
  headers:
    - name: accept
      value: "*/*"
    - name: access-token
      value: "{{API_MANAGER_SETTINGS_ACCESS_TOKEN}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "projectName": "Nome do Projeto"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
