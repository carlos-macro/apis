info:
  name: Configurar Projeto
  type: http
  seq: 3

http:
  method: POST
  url: "{{API_MANAGER_URL}}/projectsetting"
  headers:
    - name: accept
      value: "*/*"
    - name: access-token
      value: "{{API_MANAGER_SETTINGS_ACCESS_TOKEN}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "projectId": "project_id",
        "settingsData": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
