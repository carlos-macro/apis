info:
  name: Dados Complementares
  type: http
  seq: 9

http:
  method: PUT
  url: "{{API_MANAGER_URL}}/projectsetting/{{PROJECT_ID}}/complement-data"
  headers:
    - name: accept
      value: "*/*"
    - name: access-token
      value: "{{API_MANAGER_SETTINGS_ACCESS_TOKEN}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "enable": true,
        "base": "ura"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
