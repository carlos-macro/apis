info:
  name: Etapa de Criação - Intergrall
  type: http
  seq: 2

http:
  method: POST
  url: "{{API_MANAGER_URL}}/intergrall/integration"
  headers:
    - name: access-token
      value: "{{API_MANAGER_INTERGRALL_TOKEN}}"
  body:
    type: json
    data: |-
      {
        "projectId": "{{PROJECT_ID}}",
        "step": "Create",
        "payload": {
          "DadosCampanha": [
            {
              "origin": "dealer|oficial",
              "vitrine": "string",
              "modalidade": "nova|portabilidade",
              "productId": "string",
              "bonus": "string",
              "oferta": "string",
              "vendedor": "string",
              "status": "Shinobi"
            }
          ]
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if(res.getStatus() == 200){
            bru.setVar("INTERGRALL_SEQUENCE_ID", res.getBody().data.sequenceId)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
