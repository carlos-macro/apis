info:
  name: Buscar "Catálogo de Configurações"
  type: http
  seq: 1

http:
  method: get
  url: "{{URL_API_MANAGER}}/projectsetting/catalog"
  headers:
    - name: accept
      value: "*/*"
    - name: access-token
      value: "{{API_MANAGER_SETTINGS_ACCESS_TOKEN}}"
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
