info:
  name: Listagem de Projetos Configurados
  type: http
  seq: 1

http:
  method: get
  url: "{{API_MANAGER_URL}}/projectsetting?page=1&pageSize=50"
  headers:
    - name: accept
      value: "*/*"
    - name: access-token
      value: "{{API_MANAGER_SETTINGS_ACCESS_TOKEN}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "50"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
