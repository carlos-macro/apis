info:
  name: Configurar como "Default"
  type: http
  seq: 8

http:
  method: PUT
  url: "{{API_MANAGER_URL}}/projectsetting/{{PROJECT_ID_NOVA_CONFIGURACAO}}/modules/Default"
  headers:
    - name: accept
      value: "*/*"
    - name: access-token
      value: "{{API_MANAGER_SETTINGS_ACCESS_TOKEN}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
