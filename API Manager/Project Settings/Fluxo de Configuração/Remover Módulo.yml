info:
  name: Remover Módulo
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{API_MANAGER_URL}}/projectsetting/{{PROJECT_ID_NOVA_CONFIGURACAO}}/modules/{{MODULE_NAME}}"
  headers:
    - name: accept
      value: "*/*"
    - name: access-token
      value: "{{API_MANAGER_SETTINGS_ACCESS_TOKEN}}"
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: PROJECT_ID
      value: "4918426002742418530"
    - name: MODULE_NAME
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
