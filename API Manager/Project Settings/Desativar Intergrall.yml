info:
  name: Desativar Intergrall
  type: http
  seq: 11

http:
  method: DELETE
  url: "{{API_MANAGER_URL}}/projectsetting/{{PROJECT_ID}}/intergrall"
  headers:
    - name: accept
      value: "*/*"
    - name: access-token
      value: "{{API_MANAGER_SETTINGS_ACCESS_TOKEN}}"
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
