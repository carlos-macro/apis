info:
  name: Criação de Lead (ApiManager)
  type: http
  seq: 1

http:
  method: POST
  url: "{{API_MANAGER_URL}}/v2/data"
  headers:
    - name: access-token
      value: "{{API_MANAGER_DATA_ACCESS_TOKEN}}"
  body:
    type: json
    data: |-
      {
        "orderId": "",
        "orderRef": null,
        "projectId": "{{PROJECT_ID}}",
        "projectType": "Checkout",
        "productType": "Teste",
        "sellType": null,
        "status": "FluxoOnline.Lead",
        "automation": null,
        "datas": [
          {
            "name": "email",
            "value": "teste@teste.com"
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if(res.getStatus() == 200){
            bru.setVar("INTERGRALL_ORDER_ID", res.getBody().data.orderId)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
