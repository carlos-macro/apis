info:
  name: Configurar Abandono
  type: http
  seq: 7

http:
  method: PUT
  url: "{{API_MANAGER_URL}}/projectsetting/{{PROJECT_ID}}/recovery"
  headers:
    - name: accept
      value: "*/*"
    - name: access-token
      value: "{{API_MANAGER_SETTINGS_ACCESS_TOKEN}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "enable": true,
        "minutes": 1,
        "ignoreChatbot": false,
        "chatbotMinutes": 1,
        "maxHours": 4
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
